name: mgk_pharmacy
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  dio: ^5.11.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.0.1
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  image_picker: 1.2.3
  intl: ^0.20.3
  latlong2: ^0.10.1
  path_provider: ^2.1.6
  pdfrx: ^2.4.8
  provider: ^6.1.5+1
  shared_preferences: 2.5.5
  url_launcher: ^6.3.3
  wakelock_plus: ^1.8.1
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: 0.14.4
  flutter_native_splash: 2.4.7

flutter:
  uses-material-design: true

# App icon and splash: the MGK mark, drawn by tool/make_brand_assets.py.
# Regenerate with: dart run flutter_launcher_icons && dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#D71F33"
  adaptive_icon_foreground: assets/brand/icon_foreground.png
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#0F172A" # ink, for phones in dark mode
  image: assets/brand/splash.png
  android_12:
    color: "#FFFFFF"
    color_dark: "#0F172A"
    image: assets/brand/splash_android12.png
  android: true
  ios: true
  web: false
